<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>The Fischhood - Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 flex items-center justify-center min-h-screen p-4">
  <div class="bg-slate-900 border border-slate-800 rounded-xl p-8 w-full max-w-sm text-center space-y-4">
    <h1 class="text-2xl font-bold">The Fischhood</h1>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <p class="text-rose-400 text-sm font-semibold">{{ message }}</p>
      {% endfor %}
    {% endwith %}

    <form action="{{ url_for('login') }}" method="POST" class="space-y-4">
      <input
        type="text"
        name="username"
        placeholder="Enter username"
        required
        class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-2.5 text-white focus:outline-none focus:border-blue-500"
      >
      <div class="flex gap-2">
        <button type="submit" name="action" value="login" class="w-1/2 bg-blue-600 hover:bg-blue-500 text-white font-bold py-2.5 rounded-lg">
          Login
        </button>
        <button type="submit" name="action" value="register" class="w-1/2 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold py-2.5 rounded-lg">
          Create Account
        </button>
      </div>
    </form>
  </div>
</body>
</html>
