<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>The Fischhood - Game</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body style="background-image: url('{{ bg_image }}'); background-size: cover; background-position: center;" class="flex flex-col items-center justify-center min-h-screen transition-all duration-500">

    <div class="absolute top-4 left-4">
        <a href="{{ url_for('start_screen') }}" class="bg-gray-800 hover:bg-gray-700 text-white font-bold px-4 py-2 rounded-lg border border-gray-600 shadow-lg text-sm">
            🏠 Home
        </a>
    </div>

    <div class="bg-gray-800 bg-opacity-90 p-8 rounded-xl shadow-2xl text-center max-w-lg w-full border border-gray-700">
        
        <!-- Player Stats Bar -->
        <div class="mb-4 bg-gray-900 px-4 py-2 rounded-lg border border-gray-700 flex justify-between items-center text-white">
            <span class="font-bold">👤 {{ user.username }}</span>
            <span class="text-yellow-400 font-extrabold">🪙 Coins: {{ user.coins }}</span>
        </div>

        <h1 class="text-3xl font-extrabold mb-2 tracking-wide text-white">📍 {{ current_loc }}</h1>
        <p class="text-sm text-gray-300 mb-6">🧍‍♂️ 🎣 Cast your line into the depths</p>

        <form method="POST" class="space-y-4">
            <button name="action" value="cast" class="w-full bg-blue-600 hover:bg-blue-500 font-bold py-3 rounded-lg transition shadow-lg text-white">
                Cast Line 🎣
            </button>

            <div class="flex gap-2">
                <select name="destination" class="bg-gray-700 text-white px-3 py-2 rounded-lg flex-grow border border-gray-600 focus:outline-none">
                    {% for loc in locations %}
                        <option value="{{ loc }}" {% if loc == current_loc %}selected{% endif %}>{{ loc }}</option>
                    {% endfor %}
                </select>
                <button name="action" value="travel" class="bg-emerald-600 hover:bg-emerald-500 font-bold px-4 py-2 rounded-lg text-white transition">
                    Travel
                </button>
            </div>

            <div class="grid grid-cols-2 gap-2">
                <button name="action" value="sell" class="bg-amber-600 hover:bg-amber-500 font-bold py-2 rounded-lg transition text-xs text-white shadow">
                    💰 Sell All Fish
                </button>
                <button name="action" value="clear" class="bg-red-600/80 hover:bg-red-500 font-bold py-2 rounded-lg transition text-xs text-white shadow">
                    🗑️ Clear Inventory
                </button>
            </div>
        </form>

        {% if message %}
            <div class="mt-4 p-3 bg-gray-900 rounded-lg text-yellow-300 font-semibold border border-gray-700">
                {{ message }}
            </div>
        {% endif %}

        <div class="mt-6 text-left">
            <h2 class="text-sm font-semibold text-gray-400 border-b border-gray-700 pb-1 mb-2">Inventory ({{ inventory|length }})</h2>
            <ul class="max-h-40 overflow-y-auto space-y-1 text-sm text-gray-200">
                {% for item in inventory %}
                    <li class="bg-gray-900 px-3 py-1 rounded flex justify-between border border-gray-800">
                        <span>{{ item }}</span>
                    </li>
                {% endfor %}
            </ul>
        </div>
    </div>

</body>
</html>
