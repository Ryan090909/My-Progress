<!DOCTYPE html>
<html lang="en">
<head>

    <div class="text-center bg-gray-900/85 p-10 rounded-2xl backdrop-blur-md border border-gray-700 shadow-2xl max-w-md w-full">

            <button type="submit" class="w-full bg-gradient-to-r from-amber-400 to-yellow-500 hover:from-amber-300 hover:to-yellow-400 text-gray-900 font-black text-xl py-3 rounded-lg shadow-lg transform hover:scale-105 transition duration-200 border border-yellow-200">
